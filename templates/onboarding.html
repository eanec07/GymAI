{% extends 'base.html' %}{% block content %}<p class="eyebrow">Step 1 / Build your player profile</p><h1>Your goals don’t need to fit in a box.</h1><p class="muted">Pick a starting point, then tell Renata AI what you actually want. The more context you share, the more useful your plan will be.</p><form method="post"><div class="form-section"><p class="eyebrow">Core stats</p><div class="form-grid"><p><label>Name<input required name="name" placeholder="Your name"></label></p><p><label>Age<input required name="age" type="number" min="13" max="100" placeholder="25"></label></p><p><label>Sex<select name="sex"><option value="male">Male</option><option value="female">Female</option></select></label></p><p><label>Weight (lb)<input required name="weight" type="number" min="70" max="700" step=".1" placeholder="180"></label></p><p><label>Height (in)<input required name="height" type="number" min="48" max="96" step=".1" placeholder="70"></label></p><p><label>Experience<select name="experience"><option value="beginner">Beginner</option><option value="intermediate">Intermediate</option><option value="advanced">Advanced</option></select></label></p></div></div><div class="form-section"><p class="eyebrow">Mission parameters</p><div class="form-grid"><p><label>Main goal<select name="goal"><option value="muscle gain">Build muscle</option><option value="fat loss">Lose fat</option><option value="strength">Build strength</option><option value="maintain">Maintain or recomposition</option><option value="endurance">Build endurance</option><option value="athletic performance">Athletic performance</option></select></label></p><p><label>Training days/week<select name="days">{% for n in range(1,8) %}<option value="{{ n }}" {% if n==3 %}selected{% endif %}>{{ n }}</option>{% endfor %}</select></label></p><p><label>Preferred style<select name="training_style"><option value="">No preference</option><option>Strength training</option><option>Bodybuilding</option><option>Powerlifting</option><option>Functional fitness</option><option>Sports performance</option><option>Home workouts</option></select></label></p><p><label>Equipment access<select name="equipment"><option value="full gym">Full gym</option><option value="dumbbell">Dumbbells</option><option value="barbell">Barbell and rack</option><option value="body only">Bodyweight only</option><option value="other">Other / mixed equipment</option></select></label></p></div><p><label>What do you want to achieve? <span class="field-hint">Be specific—strength target, physique goal, sport, event, or habit.</span><textarea name="custom_goal" placeholder="Example: I want to do my first pull-up, build stronger legs for basketball, and feel confident by summer."></textarea></label></p><p><label>Other equipment you have <span class="field-hint">Optional</span><input name="equipment_notes" placeholder="Example: cable machine, kettlebells, resistance bands, treadmill"></label></p><p><label>Injuries, limitations, or movements to avoid <span class="field-hint">Optional—consult a qualified professional for medical advice.</span><textarea name="limitations" placeholder="Example: old shoulder irritation; avoid heavy overhead pressing."></textarea></label></p></div><button>Create my plan</button></form>{% endblock %}
