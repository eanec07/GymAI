{% extends 'base.html' %}{% block content %}<p class="eyebrow">Step 1 / Your foundation</p><h1>Let’s build a plan that fits your life.</h1><p class="muted">These are general fitness estimates, not medical advice. You can refine your plan as you progress.</p><form method="post"><div class="form-grid"><p><label>Name<input required name="name" placeholder="Your name"></label></p><p><label>Age<input required name="age" type="number" min="13" max="100" placeholder="25"></label></p><p><label>Sex<select name="sex"><option value="male">Male</option><option value="female">Female</option></select></label></p><p><label>Weight (lb)<input required name="weight" type="number" min="70" max="700" step=".1" placeholder="180"></label></p><p><label>Height (in)<input required name="height" type="number" min="48" max="96" step=".1" placeholder="70"></label></p><p><label>Main goal<select name="goal"><option value="muscle gain">Build muscle</option><option value="fat loss">Lose fat</option><option value="strength">Build strength</option><option value="maintain">Maintain</option></select></label></p><p><label>Training days/week<select name="days">{% for n in range(1,8) %}<option value="{{ n }}" {% if n==3 %}selected{% endif %}>{{ n }}</option>{% endfor %}</select></label></p><p><label>Experience<select name="experience"><option value="beginner">Beginner</option><option value="intermediate">Intermediate</option><option value="advanced">Advanced</option></select></label></p></div><p><label>Equipment access<select name="equipment"><option value="full gym">Full gym</option><option value="dumbbell">Dumbbells</option><option value="barbell">Barbell and rack</option><option value="body only">Bodyweight only</option></select></label></p><button>Create my plan</button></form>{% endblock %}
