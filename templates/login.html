{% extends 'base.html' %}{% block content %}<section class="auth-brand">{% set compact = false %}{% include 'components/logo.html' %}</section><p class="eyebrow">{{ t('Welcome back') }}</p><h1>{{ t('Sign in to SYLRIX.') }}</h1><form method="post" class="auth-form"><p><label>{{ t('Username or email') }}<input required name="identity" autocomplete="username" placeholder="ec_lifts or you@example.com"></label></p><p><label>{{ t('Password') }}<input required name="password" type="password" autocomplete="current-password"></label></p><button>{{ t('Sign in') }}</button><p class="auth-link">{{ t('New here?') }} <a href="{{ url_for('register') }}">{{ t('Create an account') }}</a></p></form>{% endblock %}
