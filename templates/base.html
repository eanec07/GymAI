<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}GymAI{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body><nav><a class="brand" href="{{ url_for('home') }}">GYM AI</a><a href="{{ url_for('daily_workout') }}">Daily workout</a><a href="{{ url_for('sources') }}">Data sources</a>{% if session.member_id %}<a href="{{ url_for('plan') }}">My plan</a><a href="{{ url_for('log_workout') }}">Lift log</a><a href="{{ url_for('nutrition') }}">Nutrition</a><a href="{{ url_for('physique') }}">Physique path</a><a href="{{ url_for('progress') }}">Progress</a><a href="{{ url_for('logout') }}">Sign out</a>{% else %}<a href="{{ url_for('onboarding') }}">Build my plan</a>{% endif %}</nav><main>{% for message in get_flashed_messages() %}<div class="flash">{{ message }}</div>{% endfor %}{% block content %}{% endblock %}</main></body></html>
