<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}Renata AI{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body><nav><a class="brand" href="{{ url_for('home') }}">RENATA AI</a><a href="{{ url_for('daily_workout') }}">Daily workout</a><a href="{{ url_for('sources') }}">Data sources</a>{% if session.member_id %}<a href="{{ url_for('plan') }}">My plan</a><a href="{{ url_for('log_workout') }}">Lift log</a><a href="{{ url_for('steps') }}">Steps</a><a href="{{ url_for('nutrition') }}">Nutrition</a><a href="{{ url_for('physique') }}">Physique path</a><a href="{{ url_for('progress') }}">Progress</a><a href="{{ url_for('logout') }}">Sign out</a>{% else %}<a href="{{ url_for('onboarding') }}">Build my plan</a>{% endif %}</nav><main><div class="theme-bar"><span class="eyebrow">Choose your world</span><div class="theme-buttons"><button type="button" data-theme="cyber">Cyber</button><button type="button" data-theme="olympus">Olympus</button><button type="button" data-theme="shonen">Shonen</button></div></div>{% for message in get_flashed_messages() %}<div class="flash">{{ message }}</div>{% endfor %}{% block content %}{% endblock %}</main><script>const savedTheme=localStorage.getItem('renata-ai-theme')||'cyber';document.body.dataset.theme=savedTheme;document.querySelectorAll('[data-theme]').forEach(button=>{if(button.dataset.theme===savedTheme)button.classList.add('selected');button.addEventListener('click',()=>{document.body.dataset.theme=button.dataset.theme;localStorage.setItem('renata-ai-theme',button.dataset.theme);document.querySelectorAll('[data-theme]').forEach(item=>item.classList.toggle('selected',item===button))})});</script></body></html>
