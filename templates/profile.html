{% extends 'base.html' %}{% block content %}<p class="eyebrow">Profile / preferences</p><h1>Make your training plan fit.</h1><form method="post"><input type="hidden" name="action" value="save"><div class="form-grid"><p><label>Primary goal<select name="goal">{% for goal in ['muscle gain','strength','fat loss','maintain','endurance','athletic performance'] %}<option value="{{ goal }}" {% if member.goal == goal %}selected{% endif %}>{{ goal|title }}</option>{% endfor %}</select></label></p><p><label>Training style<input name="training_style" value="{{ member.training_style }}" placeholder="Bodybuilding, powerlifting, calisthenics"></label></p><p><label>Experience<select name="experience">{% for level in ['beginner','intermediate','advanced','elite'] %}<option value="{{ level }}" {% if member.experience == level %}selected{% endif %}>{{ level|title }}</option>{% endfor %}</select></label></p><p><label>Days per week<input name="days" type="number" min="1" max="7" value="{{ member.days }}"></label></p><p><label>Session length (minutes)<input name="session_minutes" type="number" min="20" max="120" value="{{ member.session_minutes }}"></label></p><p><label>Equipment<input name="equipment" value="{{ member.equipment }}"></label></p></div><p><label>Favorite exercises<input name="favorite_exercises" value="{{ member.favorite_exercises }}"></label></p><p><label>Exercises to avoid<input name="avoid_exercises" value="{{ member.avoid_exercises }}"></label></p><button>Save changes</button></form><section class="card" style="margin-top:24px"><p class="eyebrow">Restart setup</p><h2>Start your fitness setup again.</h2><p>Clears your profile and generated-plan inputs, but keeps your account, lift logs, steps, and progress photos.</p><form method="post"><input type="hidden" name="action" value="reset_setup"><label>Type RESET to confirm<input name="confirm" autocomplete="off"></label><button>Restart setup</button></form></section>{% endblock %}
