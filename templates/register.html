{% extends 'base.html' %}{% block content %}<section class="auth-brand">{% set compact = false %}{% include 'components/logo.html' %}</section><p class="eyebrow">Join SYLRIX</p><h1>Build your account.</h1><p class="muted">Your training history, progress photos, step quests, and plans stay private to your account.</p><form method="post" class="auth-form"><p><label>Username<input required name="username" minlength="3" maxlength="30" autocomplete="username" placeholder="e.g. ec_lifts"></label></p><p><label>Email<input required name="email" type="email" autocomplete="email" placeholder="you@example.com"></label></p><p><label>Password<input required name="password" type="password" minlength="12" autocomplete="new-password" placeholder="At least 12 characters"></label></p><button>Create account</button><p class="auth-link">Already a member? <a href="{{ url_for('login') }}">Sign in</a></p></form>{% endblock %}
